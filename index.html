<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTuber/ライバー ファンサイト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* アコーディオンアニメーション */
        .accordion-content {
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
            max-height: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 500px;
            transition: max-height 0.3s ease-in-out;
        }

        /* ポップイン・フェードインアニメーション */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* カスタムスクロールバー非表示 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-20 selection:bg-pink-500 selection:text-white">

    <!-- 上部固定バー（管理者用ボタン） -->
    <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="header-page-title" class="text-xs font-semibold text-slate-300 tracking-wider">OFFICIAL FAN SITE</span>
        </div>
        <button onclick="requestAdminAccess()" class="text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 w-8 h-8 rounded-full border border-slate-700 flex items-center justify-center transition-all active:scale-95">
            <i class="fas fa-cog text-xs"></i>
        </button>
    </header>

    <!-- メインコンテンツ（スマホ幅固定・ページ切替表示） -->
    <main class="max-w-md mx-auto px-4 pt-4">
        
        <!-- ページ 1: ホーム（プロフィール ＋ SNSリンク） -->
        <div id="page-home" class="page-view space-y-5 animate-fade-in">
            <section id="sec-profile" class="text-center pt-2"></section>
            <section id="social-container" class="grid grid-cols-1 gap-2.5"></section>
        </div>

        <!-- ページ 2: おみくじ -->
        <div id="page-omikuji" class="page-view hidden space-y-4 animate-fade-in">
            <section class="bg-slate-900/90 rounded-2xl p-5 shadow-xl border border-slate-800/80 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-28 h-28 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <h2 class="text-base font-bold mb-3 border-b border-slate-800 pb-2.5 flex items-center text-slate-100">
                    <span class="w-7 h-7 rounded-lg bg-pink-500/10 border border-pink-500/20 text-pink-400 flex items-center justify-center mr-2 text-xs">
                        <i class="fas fa-crystal-ball"></i>
                    </span>
                    今日の運勢おみくじ
                </h2>
                <div class="text-center py-2">
                    <p id="omikuji-desc" class="text-xs text-slate-400 mb-4">今日のあなたの運勢を占ってみよう！（1日1回限定）</p>
                    <button id="omikuji-button" onclick="drawOmikuji()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3.5 px-6 rounded-xl transition duration-300 shadow-lg shadow-pink-500/20 transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none text-sm flex items-center justify-center">
                        <i class="fas fa-hand-sparkles mr-2"></i> おみくじを引く
                    </button>
                    
                    <!-- 結果表示エリア -->
                    <div id="omikuji-result" class="hidden mt-4 p-4 bg-slate-950/80 rounded-xl border border-slate-800 text-center relative overflow-hidden"></div>
                </div>
            </section>
        </div>

        <!-- ページ 3: スケジュール -->
        <div id="page-schedule" class="page-view hidden space-y-4 animate-fade-in">
            <section class="bg-slate-900/90 rounded-2xl p-5 shadow-xl border border-slate-800/80">
                <h2 class="text-base font-bold mb-4 border-b border-slate-800 pb-2.5 flex items-center text-slate-100">
                    <span class="w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mr-2 text-xs">
                        <i class="far fa-calendar-alt"></i>
                    </span>
                    今週のスケジュール
                </h2>
                <div id="schedule-container" class="space-y-3"></div>
            </section>
        </div>

        <!-- ページ 4: 配信ルール -->
        <div id="page-rules" class="page-view hidden space-y-4 animate-fade-in">
            <section class="bg-slate-900/90 rounded-2xl p-5 shadow-xl border border-slate-800/80">
                <h2 class="text-base font-bold mb-4 border-b border-slate-800 pb-2.5 flex items-center text-slate-100">
                    <span class="w-7 h-7 rounded-lg bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mr-2 text-xs">
                        <i class="fas fa-book"></i>
                    </span>
                    配信のルール
                </h2>
                <div id="rules-container" class="space-y-2.5"></div>
            </section>
        </div>

    </main>

    <!-- スマートフォン風 ボトムナビゲーション（フッタータブ） -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800/80 py-2 px-3">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
            <button onclick="switchPage('page-home', 'nav-home', 'PROFILE')" id="nav-home" class="nav-tab py-1 flex flex-col items-center text-pink-400 transition-colors">
                <i class="fas fa-home text-base mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">ホーム</span>
            </button>
            <button onclick="switchPage('page-omikuji', 'nav-omikuji', 'OMIKUJI')" id="nav-omikuji" class="nav-tab py-1 flex flex-col items-center text-slate-400 hover:text-slate-200 transition-colors">
                <i class="fas fa-crystal-ball text-base mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">おみくじ</span>
            </button>
            <button onclick="switchPage('page-schedule', 'nav-schedule', 'SCHEDULE')" id="nav-schedule" class="nav-tab py-1 flex flex-col items-center text-slate-400 hover:text-slate-200 transition-colors">
                <i class="far fa-calendar-alt text-base mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">予定</span>
            </button>
            <button onclick="switchPage('page-rules', 'nav-rules', 'RULES')" id="nav-rules" class="nav-tab py-1 flex flex-col items-center text-slate-400 hover:text-slate-200 transition-colors">
                <i class="fas fa-shield-alt text-base mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">ルール</span>
            </button>
        </div>
    </nav>

    <!-- 管理画面モーダル -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg max-h-[85vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden">
            <!-- モーダルヘッダー -->
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="text-sm font-bold text-white flex items-center">
                    <i class="fas fa-sliders-h mr-2 text-indigo-400"></i>サイト設定管理画面
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- モーダルコンテンツ（タブ切り替え） -->
            <div class="flex border-b border-slate-800 bg-slate-950/50 text-xs font-semibold overflow-x-auto no-scrollbar">
                <button onclick="switchAdminTab('tab-profile')" id="btn-tab-profile" class="admin-tab-btn px-4 py-3 text-pink-400 border-b-2 border-pink-500 whitespace-nowrap">プロフィール・SNS</button>
                <button onclick="switchAdminTab('tab-omikuji')" id="btn-tab-omikuji" class="admin-tab-btn px-4 py-3 text-slate-400 border-b-2 border-transparent whitespace-nowrap">おみくじ確率</button>
                <button onclick="switchAdminTab('tab-schedule')" id="btn-tab-schedule" class="admin-tab-btn px-4 py-3 text-slate-400 border-b-2 border-transparent whitespace-nowrap">スケジュール</button>
                <button onclick="switchAdminTab('tab-rules')" id="btn-tab-rules" class="admin-tab-btn px-4 py-3 text-slate-400 border-b-2 border-transparent whitespace-nowrap">ルール</button>
                <button onclick="switchAdminTab('tab-data')" id="btn-tab-data" class="admin-tab-btn px-4 py-3 text-slate-400 border-b-2 border-transparent whitespace-nowrap">データ・設定</button>
            </div>

            <!-- タブ内容エリア -->
            <div class="p-4 overflow-y-auto space-y-5 flex-1 text-xs text-slate-200">
                
                <!-- タブ1: プロフィール・SNS -->
                <div id="tab-profile" class="admin-tab-content space-y-3">
                    <h4 class="font-bold text-indigo-400 border-b border-slate-800 pb-1">基本情報</h4>
                    <div>
                        <label class="block mb-1 text-slate-400">名前</label>
                        <input id="input-name" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-400">キャッチコピー</label>
                        <input id="input-catchphrase" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-400">自己紹介文 (HTMLタグ可)</label>
                        <textarea id="input-description" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-pink-500"></textarea>
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-400">アバター画像URL</label>
                        <input id="input-avatar" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-pink-500">
                    </div>

                    <h4 class="font-bold text-indigo-400 border-b border-slate-800 pb-1 pt-3">SNSリンク</h4>
                    <div id="admin-socials-list" class="space-y-2"></div>
                </div>

                <!-- タブ2: おみくじ設定 -->
                <div id="tab-omikuji" class="admin-tab-content hidden space-y-3">
                    <p class="text-slate-400 leading-relaxed">重み（weight）の数値が大きいほど、その結果が出やすくなります。</p>
                    <div id="admin-omikuji-list" class="space-y-2"></div>
                </div>

                <!-- タブ3: スケジュール -->
                <div id="tab-schedule" class="admin-tab-content hidden space-y-3">
                    <div id="admin-schedule-list" class="space-y-2"></div>
                </div>

                <!-- タブ4: 配信ルール -->
                <div id="tab-rules" class="admin-tab-content hidden space-y-3">
                    <div id="admin-rules-list" class="space-y-2"></div>
                    <button onclick="addRuleItem()" class="bg-slate-800 hover:bg-slate-700 py-2 px-3 rounded-lg text-indigo-300 border border-slate-700 transition">
                        <i class="fas fa-plus mr-1"></i> ルール項目を追加
                    </button>
                </div>

                <!-- タブ5: データ管理 -->
                <div id="tab-data" class="admin-tab-content hidden space-y-5">
                    <div>
                        <h4 class="font-bold text-indigo-400 border-b border-slate-800 pb-1 mb-2">管理者パスワード変更</h4>
                        <div>
                            <input id="input-admin-password" type="password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none focus:border-pink-500" placeholder="新しいパスワード (未入力時は現状維持)">
                        </div>
                    </div>

                    <div>
                        <h4 class="font-bold text-indigo-400 border-b border-slate-800 pb-1 mb-1">設定データのバックアップ/復元</h4>
                        <textarea id="input-json-data" rows="5" class="w-full font-mono text-[10px] bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-300 focus:outline-none focus:border-pink-500"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="importJsonData()" class="bg-indigo-600 hover:bg-indigo-700 py-2 px-3 rounded-lg text-white font-bold transition">
                            JSONを反映
                        </button>
                        <button onclick="resetToDefaultData()" class="bg-red-900/60 hover:bg-red-800 text-red-200 py-2 px-3 rounded-lg font-bold ml-auto border border-red-800/80 transition">
                            初期化
                        </button>
                    </div>
                </div>

            </div>

            <!-- モーダル・フッター -->
            <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-between items-center">
                <button onclick="resetOmikujiHistory()" class="text-[11px] text-amber-400 hover:underline">
                    <i class="fas fa-redo-alt mr-1"></i> おみくじ試行履歴リセット
                </button>
                <button onclick="saveAdminSettings()" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-2 px-5 rounded-xl text-xs transition shadow-lg shadow-pink-500/20">
                    <i class="fas fa-save mr-1"></i> 設定を保存
                </button>
            </div>
        </div>
    </div>

    <script>
        // デフォルトデータ
        const defaultSiteData = {
            adminPassword: "admin123",
            profile: {
                name: "あなたの名前",
                catchphrase: "生活に寄り添うBGM枠🎧",
                description: "毎日配信中のライバーです！<br>朝は作業のお供に、夜は寝落ち推奨。初見さん大歓迎✨",
                avatarUrl: "https://placehold.jp/3d4070/ffffff/150x150.png?text=Icon"
            },
            socials: [
                { name: "REALITYで配信を見る", url: "https://reality.app/...", icon: "fas fa-video", color: "bg-purple-600 hover:bg-purple-700" },
                { name: "X (Twitter)", url: "https://twitter.com/...", icon: "fab fa-x-twitter", color: "bg-slate-800 border border-slate-700 hover:bg-slate-700" },
                { name: "マシュマロ (質問箱)", url: "https://marshmallow-qa.com/...", icon: "fas fa-box-open", color: "bg-pink-600 hover:bg-pink-700" }
            ],
            omikuji: [
                { result: "大吉", weight: 10, color: "text-amber-300", message: "最高の1日！今日の配信に来たら良いことあるかも✨" },
                { result: "中吉", weight: 20, color: "text-indigo-300", message: "安定した良い日。BGM枠で一緒にのんびり過ごそう！" },
                { result: "小吉", weight: 25, color: "text-emerald-300", message: "ちょっとした幸せが見つかる日。温かい飲み物を飲んでね☕" },
                { result: "吉",   weight: 25, color: "text-sky-300",  message: "マイペースが一番！無理せず自分のペースでいこう🐢" },
                { result: "末吉", weight: 15, color: "text-orange-300", message: "伸びしろたっぷり！これからどんどん運気アップ⤴️" },
                { result: "凶",   weight: 5,  color: "text-purple-400", message: "こんな日もある！配信で愚痴を吐き出してスッキリしよう💦" }
            ],
            schedule: [
                { day: "月", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 対話枠 / 24:00 寝落ち枠" },
                { day: "火", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 ゲーム枠 / 24:00 寝落ち枠" },
                { day: "水", events: "おやすみ💤" },
                { day: "木", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 企画枠 / 24:00 寝落ち枠" },
                { day: "金", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 華金飲み雑 / 24:00 寝落ち枠" },
                { day: "土", events: "ゲリラ配信予定！Xをチェックしてね" },
                { day: "日", events: "20:00 振り返り雑談 / 24:00 寝落ち枠" }
            ],
            rules: [
                { title: "🔰 初見さん・潜りさんへ", content: "無言での入室、作業用BGMとしての潜り、そのまま寝落ち、すべて大歓迎です！挨拶も無理にしなくて大丈夫ですので、お気軽にどうぞ。" },
                { title: "💬 コメントについて", content: "弾幕によるコメント流しや、他の配信者さんの名前を出す行為はお控えください。みんなで心地よい空間を作りましょう！" },
                { title: "🎵 歌のリクエスト", content: "歌枠中のリクエストは大歓迎です！知っている曲ならワンフレーズだけでも歌います。ボカロ、アニソンが得意です。" }
            ]
        };

        let siteData = {};

        document.addEventListener("DOMContentLoaded", () => {
            loadSiteData();
            renderAll();
        });

        function loadSiteData() {
            const saved = localStorage.getItem('customSiteData');
            if (saved) {
                try {
                    siteData = JSON.parse(saved);
                    if (!siteData.adminPassword) siteData.adminPassword = defaultSiteData.adminPassword;
                } catch(e) {
                    siteData = JSON.parse(JSON.stringify(defaultSiteData));
                }
            } else {
                siteData = JSON.parse(JSON.stringify(defaultSiteData));
            }
        }

        function renderAll() {
            // プロフィール描画
            document.getElementById('sec-profile').innerHTML = `
                <div class="relative inline-block mb-3">
                    <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-pink-500 to-indigo-500 blur-sm opacity-75"></div>
                    <img src="${siteData.profile.avatarUrl}" alt="Avatar" class="relative w-28 h-28 rounded-full border-2 border-slate-800 shadow-2xl object-cover">
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight mb-1 text-white">${siteData.profile.name}</h1>
                <p class="text-pink-400 text-xs font-semibold tracking-wide mb-3">${siteData.profile.catchphrase}</p>
                <div class="bg-slate-900/60 rounded-xl p-3.5 border border-slate-800/80 text-xs text-slate-300 leading-relaxed text-left">
                    ${siteData.profile.description}
                </div>
            `;

            // SNS描画
            let socialsHtml = '';
            siteData.socials.forEach(social => {
                socialsHtml += `<a href="${social.url}" target="_blank" rel="noopener noreferrer" class="${social.color} text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition duration-200 shadow-lg text-xs active:scale-98"><i class="${social.icon} text-base mr-2.5"></i> ${social.name}</a>`;
            });
            document.getElementById('social-container').innerHTML = socialsHtml;

            // スケジュール描画
            let scheduleHtml = '';
            siteData.schedule.forEach(item => {
                const isOff = item.events.includes('おやすみ');
                scheduleHtml += `
                    <div class="flex items-start bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/50">
                        <div class="w-10 font-bold text-xs ${isOff ? 'text-slate-500' : 'text-pink-400'} pt-0.5">${item.day}</div>
                        <div class="flex-1 text-xs text-slate-300 leading-relaxed ${isOff ? 'text-slate-500' : ''}">${item.events}</div>
                    </div>`;
            });
            document.getElementById('schedule-container').innerHTML = scheduleHtml;

            // ルール描画
            let rulesHtml = '';
            siteData.rules.forEach((rule, index) => {
                rulesHtml += `
                    <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-950/60">
                        <button class="w-full flex justify-between items-center p-3 text-left font-semibold text-xs focus:outline-none hover:bg-slate-800/50 transition" onclick="toggleAccordion(${index})">
                            <span class="text-slate-200">${rule.title}</span>
                            <i id="icon-${index}" class="fas fa-chevron-down text-slate-500 text-[10px] transition-transform duration-300"></i>
                        </button>
                        <div id="content-${index}" class="accordion-content bg-slate-900/40 text-xs text-slate-300 px-3">
                            <div class="py-2.5 border-t border-slate-800/50 leading-relaxed text-[11px] text-slate-400">${rule.content}</div>
                        </div>
                    </div>`;
            });
            document.getElementById('rules-container').innerHTML = rulesHtml;

            checkOmikujiHistory();
        }

        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        // 画面（ページ）切替処理
        function switchPage(pageId, navId, pageTitle) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
            
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('text-pink-400');
                tab.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(navId);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-pink-400');
            }

            document.getElementById('header-page-title').innerText = pageTitle;
        }

        // おみくじ（確率・重み付き抽選）
        function checkOmikujiHistory() {
            const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
            const lastDrawDate = localStorage.getItem('omikujiDate');

            if (lastDrawDate === today) {
                const savedResult = localStorage.getItem('omikujiResult');
                if (savedResult) {
                    const drawn = JSON.parse(savedResult);
                    displayResult(drawn, "本日はすでに引いています！また明日✨");
                }
            }
        }

        function drawOmikuji() {
            const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
            const fortunes = siteData.omikuji;
            
            const totalWeight = fortunes.reduce((sum, item) => sum + Number(item.weight), 0);
            let randomValue = Math.random() * totalWeight;
            let drawn = fortunes[0];

            for (const item of fortunes) {
                if (randomValue < Number(item.weight)) {
                    drawn = item;
                    break;
                }
                randomValue -= Number(item.weight);
            }

            localStorage.setItem('omikujiDate', today);
            localStorage.setItem('omikujiResult', JSON.stringify(drawn));

            displayResult(drawn, "今日の運勢はこちら！");
        }

        function displayResult(drawn, prefixMsg) {
            const resultDiv = document.getElementById('omikuji-result');
            const button = document.getElementById('omikuji-button');
            const desc = document.getElementById('omikuji-desc');
            
            resultDiv.innerHTML = `
                <div class="text-[11px] text-slate-400 mb-1">${prefixMsg}</div>
                <div class="text-3xl font-black ${drawn.color} mb-2 tracking-widest drop-shadow">${drawn.result}</div>
                <div class="text-xs text-slate-300 leading-relaxed">${drawn.message}</div>
            `;

            resultDiv.classList.remove('hidden');
            resultDiv.classList.remove('animate-pop');
            void resultDiv.offsetWidth;
            resultDiv.classList.add('animate-pop');
            
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-check mr-1.5"></i> 引き終わりました';
            desc.classList.add('hidden');
        }

        // 管理者画面認証・モーダル
        function requestAdminAccess() {
            const inputPw = prompt("管理者用パスワードを入力してください:");
            if (inputPw === null) return;

            const currentPw = siteData.adminPassword || defaultSiteData.adminPassword;
            if (inputPw === currentPw) {
                openAdminModal();
            } else {
                alert("パスワードが一致しません。");
            }
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            
            document.getElementById('input-name').value = siteData.profile.name;
            document.getElementById('input-catchphrase').value = siteData.profile.catchphrase;
            document.getElementById('input-description').value = siteData.profile.description;
            document.getElementById('input-avatar').value = siteData.profile.avatarUrl;
            document.getElementById('input-admin-password').value = "";

            let socialsAdminHtml = '';
            siteData.socials.forEach((item, index) => {
                socialsAdminHtml += `
                    <div class="p-2 bg-slate-950 border border-slate-800 rounded-lg space-y-1.5">
                        <input type="text" id="admin-social-name-${index}" value="${item.name}" placeholder="表示名" class="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-xs">
                        <input type="text" id="admin-social-url-${index}" value="${item.url}" placeholder="URL" class="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-xs">
                    </div>`;
            });
            document.getElementById('admin-socials-list').innerHTML = socialsAdminHtml;

            let omikujiAdminHtml = '';
            siteData.omikuji.forEach((item, index) => {
                omikujiAdminHtml += `
                    <div class="p-2 bg-slate-950 border border-slate-800 rounded-lg space-y-1.5">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-300 w-10">${item.result}</span>
                            <label class="text-[11px] text-slate-400">重み:</label>
                            <input type="number" id="admin-omikuji-weight-${index}" value="${item.weight}" class="w-16 bg-slate-900 p-1 rounded border border-slate-700 text-xs text-center font-bold text-pink-400">
                        </div>
                        <input type="text" id="admin-omikuji-msg-${index}" value="${item.message}" placeholder="メッセージ" class="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-xs">
                    </div>`;
            });
            document.getElementById('admin-omikuji-list').innerHTML = omikujiAdminHtml;

            let scheduleAdminHtml = '';
            siteData.schedule.forEach((item, index) => {
                scheduleAdminHtml += `
                    <div class="p-1.5 bg-slate-950 border border-slate-800 rounded-lg flex items-center gap-2">
                        <span class="font-bold w-6 text-center text-indigo-400">${item.day}</span>
                        <input type="text" id="admin-schedule-event-${index}" value="${item.events}" class="flex-1 bg-slate-900 p-1.5 rounded border border-slate-700 text-xs">
                    </div>`;
            });
            document.getElementById('admin-schedule-list').innerHTML = scheduleAdminHtml;

            renderAdminRules();
            document.getElementById('input-json-data').value = JSON.stringify(siteData, null, 2);
        }

        function renderAdminRules() {
            let rulesAdminHtml = '';
            siteData.rules.forEach((item, index) => {
                rulesAdminHtml += `
                    <div class="p-2 bg-slate-950 border border-slate-800 rounded-lg space-y-1.5">
                        <div class="flex justify-between items-center gap-2">
                            <input type="text" id="admin-rule-title-${index}" value="${item.title}" class="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-xs font-bold">
                            <button onclick="removeRuleItem(${index})" class="text-red-400 hover:text-red-300 text-xs shrink-0 px-1">削除</button>
                        </div>
                        <textarea id="admin-rule-content-${index}" rows="2" class="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-xs">${item.content}</textarea>
                    </div>`;
            });
            document.getElementById('admin-rules-list').innerHTML = rulesAdminHtml;
        }

        function addRuleItem() {
            siteData.rules.push({ title: "新規ルール項目", content: "ルールの内容を入力してください。" });
            renderAdminRules();
        }

        function removeRuleItem(index) {
            siteData.rules.splice(index, 1);
            renderAdminRules();
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.admin-tab-btn').forEach(el => {
                el.classList.remove('text-pink-400', 'border-pink-500');
                el.classList.add('text-slate-400', 'border-transparent');
            });

            document.getElementById(tabId).classList.remove('hidden');
            const btn = document.getElementById(`btn-${tabId}`);
            btn.classList.add('text-pink-400', 'border-pink-500');
            btn.classList.remove('text-slate-400', 'border-transparent');
        }

        function saveAdminSettings() {
            const newPw = document.getElementById('input-admin-password').value.trim();
            if (newPw) siteData.adminPassword = newPw;

            siteData.profile.name = document.getElementById('input-name').value;
            siteData.profile.catchphrase = document.getElementById('input-catchphrase').value;
            siteData.profile.description = document.getElementById('input-description').value;
            siteData.profile.avatarUrl = document.getElementById('input-avatar').value;

            siteData.socials.forEach((item, index) => {
                const nameEl = document.getElementById(`admin-social-name-${index}`);
                const urlEl = document.getElementById(`admin-social-url-${index}`);
                if (nameEl && urlEl) {
                    item.name = nameEl.value;
                    item.url = urlEl.value;
                }
            });

            siteData.omikuji.forEach((item, index) => {
                const weightEl = document.getElementById(`admin-omikuji-weight-${index}`);
                const msgEl = document.getElementById(`admin-omikuji-msg-${index}`);
                if (weightEl && msgEl) {
                    item.weight = Number(weightEl.value) || 0;
                    item.message = msgEl.value;
                }
            });

            siteData.schedule.forEach((item, index) => {
                const eventEl = document.getElementById(`admin-schedule-event-${index}`);
                if (eventEl) item.events = eventEl.value;
            });

            siteData.rules.forEach((item, index) => {
                const titleEl = document.getElementById(`admin-rule-title-${index}`);
                const contentEl = document.getElementById(`admin-rule-content-${index}`);
                if (titleEl && contentEl) {
                    item.title = titleEl.value;
                    item.content = contentEl.value;
                }
            });

            localStorage.setItem('customSiteData', JSON.stringify(siteData));
            renderAll();
            closeAdminModal();
            alert("設定を更新しました！");
        }

        function resetOmikujiHistory() {
            localStorage.removeItem('omikujiDate');
            localStorage.removeItem('omikujiResult');
            
            const button = document.getElementById('omikuji-button');
            const desc = document.getElementById('omikuji-desc');
            const resultDiv = document.getElementById('omikuji-result');
            
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-hand-sparkles mr-2"></i> おみくじを引く';
            desc.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            alert("本日の試行履歴をクリアしました。");
        }

        function importJsonData() {
            const rawJson = document.getElementById('input-json-data').value;
            try {
                const parsed = JSON.parse(rawJson);
                siteData = parsed;
                if (!siteData.adminPassword) siteData.adminPassword = defaultSiteData.adminPassword;
                localStorage.setItem('customSiteData', JSON.stringify(siteData));
                renderAll();
                closeAdminModal();
                alert("JSONデータを正常に復元しました！");
            } catch(e) {
                alert("JSONフォーマットエラー: " + e.message);
            }
        }

        function resetToDefaultData() {
            if (confirm("すべての設定を破棄して初期値に戻しますか？")) {
                localStorage.removeItem('customSiteData');
                loadSiteData();
                renderAll();
                closeAdminModal();
                alert("初期化完了（初期パスワード: admin123）");
            }
        }
    </script>
</body>
</html>
