<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber/ライバー ファンサイト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .accordion-content {
            transition: max-height 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 300px;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4 space-y-8">
        
        <!-- 1. プロフィールエリア -->
        <section id="profile-container" class="text-center pt-8"></section>

        <!-- 2. SNSリンクエリア -->
        <section id="social-container" class="flex flex-col gap-3"></section>

        <!-- 3. おみくじエリア -->
        <section class="bg-slate-800 rounded-xl p-5 shadow-lg border border-slate-700 text-center">
            <h2 class="text-xl font-bold mb-3 border-b border-slate-600 pb-2 text-left">
                <i class="fas fa-ticket-alt mr-2 text-pink-400"></i>今日の運勢おみくじ
            </h2>
            <p id="omikuji-desc" class="text-sm text-slate-400 mb-4">リスナーさんの今日の運勢は？（1日1回限定）</p>
            <button id="omikuji-button" onclick="drawOmikuji()" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-full transition duration-300 shadow-md transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                <i class="fas fa-hand-sparkles mr-1"></i> おみくじを引く
            </button>
            
            <!-- 結果表示エリア -->
            <div id="omikuji-result" class="hidden mt-5 p-4 bg-slate-900 rounded-lg border border-slate-700"></div>
        </section>

        <!-- 4. スケジュールエリア -->
        <section class="bg-slate-800 rounded-xl p-5 shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 border-b border-slate-600 pb-2">
                <i class="far fa-calendar-alt mr-2 text-indigo-400"></i>今週のスケジュール
            </h2>
            <div id="schedule-container" class="space-y-4"></div>
        </section>

        <!-- 5. 配信ルールエリア -->
        <section class="bg-slate-800 rounded-xl p-5 shadow-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 border-b border-slate-600 pb-2">
                <i class="fas fa-book mr-2 text-indigo-400"></i>配信のルール
            </h2>
            <div id="rules-container" class="space-y-3"></div>
        </section>

    </div>

    <script>
        // =========================================================
        // ✍️ データの定義
        // =========================================================
        const siteData = {
            profile: {
                name: "あなたの名前",
                catchphrase: "あなたの生活に寄り添うBGM枠🎧",
                description: "毎日配信中のライバーです！<br>朝は作業のお供に、夜は寝落ち推奨。初見さん大歓迎✨",
                avatarUrl: "https://placehold.jp/3d4070/ffffff/150x150.png?text=Icon"
            },
            
            socials: [
                { name: "REALITYで配信を見る", url: "https://reality.app/...", icon: "fas fa-video", color: "bg-purple-600 hover:bg-purple-700" },
                { name: "X (Twitter)", url: "https://twitter.com/...", icon: "fab fa-x-twitter", color: "bg-slate-900 border border-slate-600 hover:bg-slate-800" },
                { name: "マシュマロ (匿名質問)", url: "https://marshmallow-qa.com/...", icon: "fas fa-box-open", color: "bg-pink-600 hover:bg-pink-700" }
            ],
            
            omikuji: [
                { result: "大吉", color: "text-yellow-400", message: "最高の1日！今日の配信に来たら良いことあるかも✨" },
                { result: "中吉", color: "text-indigo-300", message: "安定した良い日。BGM枠で一緒にのんびり過ごそう！" },
                { result: "小吉", color: "text-green-300", message: "ちょっとした幸せが見つかる日。温かい飲み物を飲んでね☕" },
                { result: "吉", color: "text-blue-300", message: "マイペースが一番！無理せず自分のペースでいこう🐢" },
                { result: "末吉", color: "text-orange-300", message: "伸びしろたっぷり！これからどんどん運気アップ⤴️" },
                { result: "凶", color: "text-purple-400", message: "こんな日もある！配信で愚痴を吐き出してスッキリしよう💦" }
            ],

            schedule: [
                { day: "月", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 対話枠 / 24:00 寝落ち枠" },
                { day: "火", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 ゲーム枠 / 24:00 寝落ち枠" },
                { day: "水", events: "おやすみ💤" },
                { day: "木", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 企画枠 / 24:00 寝落ち枠" },
                { day: "金", events: "07:00 歌雑枠 / 12:00 お昼雑談<br>20:00 華金飲み雑 / 24:00 寝落ち枠" },
                { day: "土", events: "ゲリラ配信予定！Xをチェックしてね" },
                { day: "日", events: "20:00 振り返り雑談 / 24:00 寝落ち枠" }
            ],
            
            rules: [
                { title: "🔰 初見さん・潜りさんへ", content: "無言での入室、作業用BGMとしての潜り、そのまま寝落ち、すべて大歓迎です！挨拶も無理にしなくて大丈夫ですので、お気軽にどうぞ。" },
                { title: "💬 コメントについて", content: "弾幕によるコメント流しや、他の配信者さんの名前を出す行為はお控えください。みんなで心地よい空間を作りましょう！" },
                { title: "🎵 歌のリクエスト", content: "歌枠中のリクエストは大歓迎です！知っている曲ならワンフレーズだけでも歌います。ボカロ、アニソンが得意です。" }
            ]
        };

        // =========================================================
        // ⚙️ 画面を描画する処理
        // =========================================================
        document.addEventListener("DOMContentLoaded", () => {
            
            // プロフィール、SNS、スケジュール、ルールの描画
            document.getElementById('profile-container').innerHTML = `
                <div class="relative inline-block mb-4">
                    <img src="${siteData.profile.avatarUrl}" alt="Avatar" class="w-32 h-32 rounded-full border-4 border-indigo-500 shadow-lg object-cover">
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight mb-2">${siteData.profile.name}</h1>
                <p class="text-indigo-400 font-medium mb-3">${siteData.profile.catchphrase}</p>
                <p class="text-slate-300 text-sm leading-relaxed px-4">${siteData.profile.description}</p>
            `;

            let socialsHtml = '';
            siteData.socials.forEach(social => {
                socialsHtml += `<a href="${social.url}" target="_blank" rel="noopener noreferrer" class="${social.color} text-white font-bold py-3 px-4 rounded-full flex items-center justify-center transition duration-300 shadow-md"><i class="${social.icon} text-lg mr-2"></i> ${social.name}</a>`;
            });
            document.getElementById('social-container').innerHTML = socialsHtml;

            let scheduleHtml = '';
            siteData.schedule.forEach(item => {
                const isOff = item.events.includes('おやすみ');
                scheduleHtml += `<div class="flex items-start border-b border-slate-700 pb-3 last:border-0 last:pb-0"><div class="w-12 pt-1 font-bold ${isOff ? 'text-slate-500' : 'text-indigo-400'}">${item.day}</div><div class="flex-1 text-sm text-slate-300 leading-relaxed ${isOff ? 'text-slate-500' : ''}">${item.events}</div></div>`;
            });
            document.getElementById('schedule-container').innerHTML = scheduleHtml;

            let rulesHtml = '';
            siteData.rules.forEach((rule, index) => {
                rulesHtml += `<div class="border border-slate-600 rounded-lg overflow-hidden bg-slate-900"><button class="w-full flex justify-between items-center p-4 text-left font-semibold focus:outline-none hover:bg-slate-800 transition" onclick="toggleAccordion(${index})"><span>${rule.title}</span><i id="icon-${index}" class="fas fa-chevron-down text-slate-400 transition-transform duration-300"></i></button><div id="content-${index}" class="accordion-content bg-slate-800 text-sm text-slate-300 px-4"><div class="py-3">${rule.content}</div></div></div>`;
            });
            document.getElementById('rules-container').innerHTML = rulesHtml;

            // ★追加: ページ読み込み時におみくじの履歴をチェック
            checkOmikujiHistory();
        });

        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        // =========================================================
        // ★追加・修正: おみくじのロジック（1日1回制限）
        // =========================================================
        function checkOmikujiHistory() {
            // 日本時間での今日の日付を取得 (YYYY/MM/DD形式)
            const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
            const lastDrawDate = localStorage.getItem('omikujiDate');

            if (lastDrawDate === today) {
                // 今日すでに引いている場合は、保存された結果を表示
                const savedResult = localStorage.getItem('omikujiResult');
                if (savedResult) {
                    const drawn = JSON.parse(savedResult);
                    displayResult(drawn, "本日はすでに引いています！また明日✨");
                }
            }
        }

        function drawOmikuji() {
            const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
            const fortunes = siteData.omikuji;
            
            // ランダムに1つ選ぶ
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const drawn = fortunes[randomIndex];

            // ローカルストレージに今日の日付と結果を保存
            localStorage.setItem('omikujiDate', today);
            localStorage.setItem('omikujiResult', JSON.stringify(drawn));

            // 画面に結果を表示
            displayResult(drawn, "今日の運勢はこちら！");
        }

        function displayResult(drawn, prefixMsg) {
            const resultDiv = document.getElementById('omikuji-result');
            const button = document.getElementById('omikuji-button');
            const desc = document.getElementById('omikuji-desc');
            
            // 結果の中身をセット
            resultDiv.innerHTML = `
                <div class="text-xs text-slate-400 mb-2">${prefixMsg}</div>
                <div class="text-3xl font-extrabold ${drawn.color} mb-2 tracking-widest">${drawn.result}</div>
                <div class="text-sm text-slate-300 leading-relaxed">${drawn.message}</div>
            `;

            // 表示してアニメーションさせる
            resultDiv.classList.remove('hidden');
            resultDiv.classList.remove('animate-pop');
            void resultDiv.offsetWidth; // アニメーションのリセット用
            resultDiv.classList.add('animate-pop');
            
            // ボタンを「引き終わりました」の状態にして無効化
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-check mr-1"></i> 今日は引き終わりました';
            desc.classList.add('hidden'); // 説明文を隠してスッキリさせる
        }
    </script>
</body>
</html>
